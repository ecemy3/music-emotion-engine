experiment_name: crnn_v2
seed: 42
split:
  train_count: 1261
  val_count: 271
  test_count: 270
training:
  batch_size: 4
  epochs: 60
  lr: 0.001
  optimizer: adam
  weight_decay: 1e-05
  dropout: 0.3
  loss: mse_ccc
  augmentation: specaugment
model:
  hidden_size: 128
  num_layers: 2
  bidirectional: True
artifacts:
  best_model: models\crnn_v2_best.pt
  last_model: models\crnn_v2_last.pt
  predictions: results\crnn_v2_predictions.csv
  history: logs\crnn_v2_history.csv
